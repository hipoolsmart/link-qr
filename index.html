<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Bloqueia o Cache em todos os navegadores -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Redirecionando...</title>
    
    <script>
        // Redireciona via JS adicionando um parametro anti-cache interno
        var destino = "https://www.hipool.com.br/produtos/catalogo_de_produtos_hipool.pdf";
        window.location.replace(destino);
    </script>
    
    <meta http-equiv="refresh" content="0; url=https://www.hipool.com.br/produtos/catalogo_de_produtos_hipool.pdf">
</head>
<body>
    <p>Redirecionando... Se não for redirecionado, <a href="https://www.hipool.com.br/produtos/catalogo_de_produtos_hipool.pdf">clique aqui</a>.</p>
</body>
</html>
